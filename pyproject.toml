[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-phone-kit"
dynamic = ["version"]
description = "FastAPI server tools, signed post-call webhooks and pytest replays for ElevenLabs phone agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Lopez" }]
keywords = ["elevenlabs", "voice agents", "fastapi", "webhooks", "twilio", "sip", "pytest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Telephony",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  # For TestClient, used by the pytest plugin: Starlette 1.x uses httpx2, older Starlette httpx.
  "httpx2>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
postgres = ["psycopg[binary]>=3.1"]

[project.entry-points.pytest11]
agent_phone_kit = "agent_phone_kit.pytest_plugin"

[project.urls]
Repository = "https://github.com/woodbeary/agent-phone-kit"

[tool.hatch.version]
path = "src/agent_phone_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_phone_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
phone_kit_conversations = ["tests/conversations"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
